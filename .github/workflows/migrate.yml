name: Run DB Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger v4 migration
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" "${{ secrets.SITE_URL }}/backend/public/api/cron/run-migration" \
            -H "X-Cron-Token: ${{ secrets.INTERNAL_CRON_TOKEN }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Migration returned non-200 status: $HTTP_CODE"
            exit 1
          fi

name: Daily Renewal Processor

on:
  schedule:
    # 3:30 AM UTC = 9:00 AM IST
    - cron: '30 3 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI for testing

jobs:
  process-renewals:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger renewal processor
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" "${{ secrets.SITE_URL }}/backend/public/api/cron/run-renewals" \
            -H "X-Cron-Token: ${{ secrets.INTERNAL_CRON_TOKEN }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Renewal processor returned non-200 status: $HTTP_CODE"
            exit 1
          fi
